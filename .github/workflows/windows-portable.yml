name: Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows portable build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run tauri:build:portable

      - name: Upload portable executable
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: daily-dashboard-windows-portable
          path: src-tauri/target/release/V0.5.14_Daily-Dashboard.exe
