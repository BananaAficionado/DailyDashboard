name: Windows Portable

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Windows portable build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build portable executable
        run: npm run tauri:build:portable

      - name: Upload portable executable
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: daily-dashboard-windows-portable
          path: src-tauri/target/release/V0.5.14_Daily-Dashboard.exe
