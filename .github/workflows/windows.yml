name: Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to rebuild and publish (blank for an Actions artifact)
        required: false
        type: string
  push:
    branches: [main]
    tags: ["V*", "v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Audit release source for private data
        run: npm run audit:release

      - name: Verify frontend regressions
        run: npm test

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Verify native Spotify and settings regressions
        run: cargo test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml

      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/') || inputs.release_tag != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, 'A') || contains(inputs.release_tag || github.ref_name, 'B') }}
          files: src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload installer
        if: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        # Release installers remain available even if optional Actions artifact storage is full.
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard-windows
          path: src-tauri/target/release/bundle/nsis/*
          retention-days: 7
