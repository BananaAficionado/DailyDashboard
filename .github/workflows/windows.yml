name: Windows

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["V*", "v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Windows installer
        run: npm run tauri:build

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: daily-dashboard-windows
          path: src-tauri/target/release/bundle/nsis/*

      - name: Publish tagged installer to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, 'A') || contains(github.ref_name, 'B') }}
          files: src-tauri/target/release/bundle/nsis/*.exe
