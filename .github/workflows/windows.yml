name: Windows

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing release tag to build and publish (blank for an Actions artifact)
        required: false
        type: string
  push:
    branches: [main]
    tags: ["V*", "v*"]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    name: Windows build
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.release_tag || github.ref }}
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
      - run: npm ci
      - run: npm run audit:release
      - run: npm test
      - name: Build Windows installer
        run: npm run tauri:build
      - name: Native regression tests
        run: cargo test --release --locked --features tauri/custom-protocol --manifest-path src-tauri/Cargo.toml
      - name: Upload installer
        if: github.event_name != 'pull_request'
        continue-on-error: ${{ !startsWith(github.ref, 'refs/tags/') && inputs.release_tag == '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release
    if: github.event_name != 'pull_request' && (startsWith(github.ref, 'refs/tags/') || inputs.release_tag != '')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download tested installer
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: windows-installer
          path: installer
      - name: Publish tagged installer
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ inputs.release_tag || github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ contains(inputs.release_tag || github.ref_name, 'A') || contains(inputs.release_tag || github.ref_name, 'B') }}
          files: installer/*.exe
