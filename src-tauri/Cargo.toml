[package]
name = "ultrawide-daily-dashboard"
version = "0.4.3"
description = "A 1280x400 desktop dashboard for Google Calendar and Spotify."
authors = ["BananaAficionado"]
license = ""
repository = ""
edition = "2021"

[lib]
name = "ultrawide_daily_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
base64 = "0.22"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rfd = "0.15"
sha2 = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
url = "2"
